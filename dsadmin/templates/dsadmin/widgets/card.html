{% load dsadmin %}
<section class="ds-widget d-card theme-bordered bg-base-100 {{ width_class }}"{% if title %} aria-label="{{ title }}"{% endif %}>
  <div class="d-card-body gap-3 p-4">
    {% if title %}<h2 class="d-card-title text-base">{{ title }}</h2>{% endif %}
    {% if description %}<p class="text-sm ds-muted">{{ description }}</p>{% endif %}
    {% block body %}{{ body|default:"" }}{% endblock %}
  </div>
</section>
